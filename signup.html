<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Sign-In SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Facebook SDK -->
  <script async defer crossorigin="anonymous" 
    src="https://connect.facebook.net/en_US/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body, html {
      height: 100%;
    }

    body {
      background-image: url('https://images.unsplash.com/photo-1603252109303-2751441c46f9?auto=format&fit=crop&w=1470&q=80');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 15px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
      font-size: 28px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 40px 12px 40px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .input-group i {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #888;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .login-container button:hover {
      background-color: #333;
    }

    .social-login {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-login button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #f1f1f1;
      color: #333;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .social-login button i {
      font-size: 18px;
    }

    .login-container p {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #666;
    }

    .login-container p a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
    }

    .login-container p a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .login-container {
        margin: 0 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Sign Up</h2>
    <form action="/home/rguktrkvalley/Desktop/lookbook/nav_bar.html" method="get">
      <div class="input-group">
        <i class="fa fa-user"></i>
        <input type="text" placeholder="Username" required />
      </div>
      <div class="input-group">
        <i class="fa fa-envelope"></i>
        <input type="email" placeholder="Email" required />
      </div>
      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input type="password" placeholder="Password" required />
      </div>
      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input type="password" placeholder="Confirm Password" required />
      </div>
      <button type="submit" >Sign Up</button>

      <div class="social-login">
        <button type="button" onclick="handleGoogleLogin()">
          <i class="fab fa-google"></i> Sign up with Google
        </button>
        <button type="button" onclick="handleFacebookLogin()">
          <i class="fab fa-facebook-f"></i> Sign up with Facebook
        </button>
      </div>
    </form>

    <p>Already have an account? <a href="/home/rguktrkvalley/Desktop/lookbook/login.html">Login here</a></p>
  </div>

  <!-- Google Login Logic -->
  <script>
    function handleGoogleLogin() {
      alert("Redirect to Google OAuth (Sign Up) - needs Google client ID.");
    }
  </script>

  <!-- Facebook Login Logic -->
  <script>
    window.fbAsyncInit = function() {
      FB.init({
        appId      : 'YOUR_FACEBOOK_APP_ID',
        cookie     : true,
        xfbml      : true,
        version    : 'v19.0'
      });
    };

    function handleFacebookLogin() {
      FB.login(function(response) {
        if (response.authResponse) {
          alert("Facebook sign-up successful! User ID: " + response.authResponse.userID);
        } else {
          alert("User cancelled or did not authorize.");
        }
      }, {scope: 'public_profile,email'});
    }
  </script>

</body>
</html>
